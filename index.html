<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚀 Space Explorer</h1>
        <p>Explore NASA's Astronomy Picture of the Day</p>
    </header>

    <main>
        <section class="search-box">
            <label for="date">Choose a date</label>
            <input type="date" id="date">
            <button onclick="getSpaceData()">Explore</button>
        </section>

        <section id="loading" class="loading">Loading space data...</section>

        <section id="result" class="space-card"></section>

        <p id="error" class="error"></p>
    </main>

    <footer>
        <p>Powered by NASA APOD API</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
